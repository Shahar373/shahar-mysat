; MySat flight software (phase 0 foundations)
;   obc    : ESP32-CAM (AI Thinker) main on-board computer
;   aux    : Arduino Nano (ATmega328P) auxiliary controller (servo, HC-12 pins)
;   native : host build of the portable core for unit tests (pio test -e native)

[platformio]
default_envs = obc
src_dir = src
lib_dir = lib
test_dir = test
data_dir = data

[env]
monitor_speed = 115200
monitor_echo = yes            ; see what you type into the console

; ---------------------------------------------------------------- OBC / ESP32-CAM
[env:obc]
platform = espressif32@^6.9.0
board = esp32cam
framework = arduino
build_src_filter = +<obc/>
build_flags =
  -I shared
  -I src/obc
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=1
  -DMYSAT_FW_VERSION=\"2.1.0-demo\"
  -DMYSAT_TARGET_OBC=1
; "Huge APP" = 3 MB app + ~1 MB LittleFS, no OTA slot. Revisit once phase-0 binary size is known.
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
; dio, not qio: the Arduino IDE's "AI Thinker ESP32-CAM" entry builds dio even when its menu says
; QIO, and some ESP32-CAM flash chips do not boot a qio image. dio at 80 MHz is what the stock
; firmware ran with.
board_build.flash_mode = dio
lib_ldf_mode = chain+
lib_deps =
  adafruit/Adafruit ADS1X15@^2.5.0
  adafruit/Adafruit NeoPixel@^1.12.3
  adafruit/Adafruit BusIO@^1.16.1
  bblanchon/ArduinoJson@^6.21.3
  makuna/RTC@^2.4.3
monitor_filters = esp32_exception_decoder, time
; Slow but dependable through the usual CH340/CP2102 adapters; a 1 MB image takes about 90 s.
; Raise to 460800 once you have seen one upload succeed.
upload_speed = 115200

; ---------------------------------------------------------------- AUX / Arduino Nano
; If upload fails with "not in sync", your Nano has the OLD bootloader: use board = nanoatmega328
[env:aux]
platform = atmelavr@^5.0.0
board = nanoatmega328new
framework = arduino
build_src_filter = +<aux/>
build_flags =
  -I shared
  -DMYSAT_TARGET_AUX=1
; Servo is not part of the AVR core package (the Arduino IDE bundles it separately), so without
; this line `pio run -e aux` stops at `#include <Servo.h>`.
lib_deps =
  arduino-libraries/Servo@^1.2.2

; ---------------------------------------------------------------- host unit tests
[env:native]
platform = native
build_src_filter = -<*>
build_flags =
  -I shared
  -std=c++17
  -DMYSAT_TARGET_NATIVE=1
test_framework = unity
